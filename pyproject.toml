[project]
name = "tansu"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "requests==2.34.2",
    "tzdata==2026.5",
    "borsapy==0.11.0",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["tansu"]

[tool.pytest.ini_options]
pythonpath = ["."]

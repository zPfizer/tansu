[project]
name = "tansu"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "requests==2.34.2",
    "tzdata==2026.5",
    "borsapy==0.11.0",
    "xlrd==2.0.2",
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.setuptools]
packages = ["tansu"]

[tool.setuptools.package-data]
tansu = ["referans/*/*.csv", "referans/*/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["F", "E9", "ERA001", "BLE001", "S110", "B017", "B905", "B023", "PLW1514"]
# PLW1514 is a preview rule. With explicit-preview-rules, only the selected preview rules turn on.
preview = true
explicit-preview-rules = true

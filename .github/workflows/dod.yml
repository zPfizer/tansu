name: dod

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  dod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install markdown-it-py==4.2.0
      - run: python .github/dod_kontrol.py
        env:
          PR_GOVDE: ${{ github.event.pull_request.body }}

name: ci

# testler yeniden-kurulus dalında zorunlu durum denetimidir (Levent 30.10.2026). Bu yüzden iş her PR'da başlar:
# yalnız .md değişince adımlar atlanır ve iş başarılı biter. Açık depo taraması ve PR iddia denetimi denetim.yml'de.
on:
  pull_request:
  push:
    branches: [main, yeniden-kurulus]

jobs:
  # Yalnız Windows: TANSU Levent'in Windows bilgisayarında çalışır.
  testler:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # HEAD^1: PR'da tabanın ucu, dalda bir önceki commit. Fark okunamazsa adım düşer; boş fark testleri koşar.
      - name: Yalnız .md mi değişti
        id: degisen
        shell: bash
        run: |
          set -euo pipefail
          # --no-renames: .py'den .md'ye adı değişen dosya eski adıyla da görünür.
          dosyalar=$(git diff --name-only --no-renames HEAD^1 HEAD)
          printf '%s\n' "$dosyalar"
          # Boru yok: grep -q erken çıkınca büyük listede printf SIGPIPE alır ve pipefail sonucu tersine çevirir.
          if [ -n "$dosyalar" ] && ! grep -qv '\.md$' <<< "$dosyalar"; then
            echo "Yalnız .md değişti; testler atlanır."
            echo "kod=hayir" >> "$GITHUB_OUTPUT"
          else
            echo "kod=evet" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        id: python
        if: steps.degisen.outputs.kod == 'evet'
        with:
          python-version: "3.14"
      # Kurulu ortam önbellekte: anahtar işletim sistemi, tam Python sürümü, kilit dosyası ve pyproject.toml.
      # Biri değişince ortam baştan kurulur. Önbellek PR'a ve tabana göre ayrı tutulur (GitHub kuralı).
      - uses: actions/cache@v4
        id: ortam
        if: steps.degisen.outputs.kod == 'evet'
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.lock.txt', 'pyproject.toml') }}
      - name: Ortamı kur
        if: steps.degisen.outputs.kod == 'evet' && steps.ortam.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.lock.txt -e ".[dev]"
      - if: steps.degisen.outputs.kod == 'evet'
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\.venv\Scripts"
      - if: steps.degisen.outputs.kod == 'evet'
        run: ruff check tansu tests kurulum
      - if: steps.degisen.outputs.kod == 'evet'
        run: ruff format --check tansu tests kurulum
      - if: steps.degisen.outputs.kod == 'evet'
        run: python -X utf8 -m pytest -q

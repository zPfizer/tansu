name: ci

on:
  pull_request:
  push:
    branches: [main, yeniden-kurulus]

jobs:
  # Yalnız Windows: TANSU Levent'in Windows bilgisayarında çalışır.
  testler:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt -e ".[dev]"
      - run: ruff check tansu tests
      - run: ruff format --check tansu tests
      - run: python -X utf8 -m pytest -q

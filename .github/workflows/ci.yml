name: ci

# Yalnız .md değişen PR'da atlanır; açık depo taraması ve PR iddia denetimi denetim.yml'de her PR'da koşar.
# testler hiçbir dalda zorunlu durum denetimi değil (gh api .../branches/<dal>/protection, 30.10.2026).
on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [main, yeniden-kurulus]
    paths-ignore: ["**.md"]

jobs:
  # Yalnız Windows: TANSU Levent'in Windows bilgisayarında çalışır.
  testler:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt -e ".[dev]"
      - run: ruff check tansu tests kurulum
      - run: ruff format --check tansu tests kurulum
      - run: python -X utf8 -m pytest -q

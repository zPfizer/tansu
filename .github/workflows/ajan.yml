name: ajan

on:
  issues:
    types: [labeled]

# One run per issue. A second label waits for the first run.
concurrency:
  group: ajan-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ajan:
    # A "yerel" issue gives a skipped run in the Actions list.
    if: >-
      github.event.label.name == 'ready-for-agent' &&
      !contains(github.event.issue.labels.*.name, 'yerel')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Minimal GITHUB_TOKEN. The action pushes, opens the PR, and comments with the Claude App
    # token (OIDC exchange, needs id-token: write). The steps below only need to read the repo.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt -e ".[dev]"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Implement GitHub issue #${{ github.event.issue.number }}. Do only this issue.
            1. Read AGENTS.md, CODING_STANDARDS.md, and DEFINITION_OF_DONE.md. Obey them.
            2. Read the issue: gh issue view ${{ github.event.issue.number }} --json number,title,body,labels,comments
            3. Create the branch pr/${{ github.event.issue.number }}-<slug> with git checkout -b. The <slug> is 2 to 4 short lowercase ASCII words from the title.
            4. Write a red test first. Then write the minimum code. A document-only issue needs no test.
            5. Before each commit, run python -m pytest -q, ruff check tansu tests .github, and ruff format --check tansu tests .github. All must pass.
            6. Add files by name. Never use git add . or git add -A.
            7. In kayit/, only add new files or append lines. Never change or delete old lines. Never touch veri/.
            8. Never use rebase, --amend, --force, reset --hard, or clean.
            9. Push the branch: git push -u origin pr/${{ github.event.issue.number }}-<slug> (the branch name of step 3). Write the PR body to /tmp/pr-body.md from the layout of .github/pull_request_template.md.
               Add the line "Closes #${{ github.event.issue.number }}". Add this run link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
               Leave the "Denetçi:" and "Sonuç:" lines empty.
               Check a PR box only with real proof after "kanıt:". If you cannot prove it, leave the box unchecked.
               Put the real pytest output in the code block under "Gerçek veri kanıtı". You have no veri/. Never invent proof.
               Open the PR: gh pr create --title "<title>" --body-file /tmp/pr-body.md
            10. Comment the PR link on the issue: gh issue comment ${{ github.event.issue.number }} --body "<link>"
            11. If you cannot finish, comment the reason on the issue. Do not open a PR with a failing test.
          claude_args: |
            --max-turns 40
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git checkout -b:*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin pr/*),Bash(git push origin pr/*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr create:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(python -m pytest:*),Bash(ruff:*)"
            --disallowedTools "Bash(git add .),Bash(git add . *),Bash(git add ./*),Bash(git add -A*),Bash(git add -u*),Bash(git add --all*),Bash(git -C*),Bash(git rebase*),Bash(git commit* --amend*),Bash(git commit* -a*),Bash(git push* --force*),Bash(git push* -f*),Bash(git push* +*),Bash(git push*master*),Bash(git push* :*),Bash(git reset --hard*),Bash(git clean*)"
